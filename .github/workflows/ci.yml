name: CI

on:
  push:
    branches: [main]
  pull_request:

# Le jeton GitHub de ce workflow ne peut que LIRE le repo.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      # Actions épinglées sur un commit précis (et pas sur une étiquette qui peut bouger).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run pytest -q
