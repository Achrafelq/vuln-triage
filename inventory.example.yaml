# Example inventory: 4 fictional firewalls covering the cases to triage.
# Versions are ALWAYS quoted.

devices:
  - name: FW-EDGE-01
    vendor: paloalto
    version: "11.1.6"
    internet_facing: true
    mgmt_exposed: true          # worst case: management reachable from the Internet
    vpn_portal_enabled: true
    auth_portal_enabled: false

  - name: FW-EDGE-02
    vendor: paloalto
    version: "11.1.6-h39"       # same branch, but with the hotfix
    internet_facing: true
    mgmt_exposed: false
    vpn_portal_enabled: true
    auth_portal_enabled: false

  - name: FW-CORE-01
    vendor: fortinet
    version: "7.6.3"
    internet_facing: false      # internal firewall, nothing exposed
    mgmt_exposed: false
    vpn_portal_enabled: false
    auth_portal_enabled: false

  - name: FW-BRANCH-01
    vendor: fortinet
    version: "7.4.8"            # branch 7.4: Fortinet says "migrate"
    internet_facing: true
    mgmt_exposed: false
    vpn_portal_enabled: true
    auth_portal_enabled: false
